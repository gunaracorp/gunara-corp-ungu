      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ogrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#a78bfa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" rx="14" fill="#09090b"/>
  <rect width="1200" height="200" rx="14" fill="url(#ogrid)"/>
  <rect width="1200" height="200" rx="14" fill="url(#oglow)"/>

  <!-- arrows -->
  <g stroke="url(#arrow)" stroke-width="2.5" fill="none">
    <path d="M298 100h96m0 0-14-8m14 8-14 8"/>
    <path d="M628 100h96m0 0-14-8m14 8-14 8"/>
    <path d="M958 100h60m0 0-14-8m14 8-14 8"/>
