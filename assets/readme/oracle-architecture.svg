  <text x="184" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#94a3b8" letter-spacing="1">Tanya apa saja · bahasa apa pun</text>

  <!-- node 2 -->
  <rect x="400" y="62" width="228" height="76" rx="12" fill="#0e0e16" stroke="url(#og)" stroke-width="1.5"/>
  <text x="514" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#c4b5fd" letter-spacing="1.5">ORACLE AI</text>
  <text x="514" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#94a3b8" letter-spacing="1">Asisten kecerdasan 24/7</text>

  <!-- node 3 -->
