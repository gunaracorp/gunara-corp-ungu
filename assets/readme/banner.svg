<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PT TOP KONSULTAN INTERNASIONAL">
  <defs>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#a78bfa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#09090b"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glowV)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>

  <!-- starfield -->
  <g fill="#e9d5ff">
    <circle cx="92" cy="52" r="1.4" opacity="0.55"/>
    <circle cx="212" cy="150" r="1" opacity="0.35"/>
    <circle cx="330" cy="40" r="1.2" opacity="0.45"/>
    <circle cx="458" cy="120" r="1" opacity="0.3"/>
    <circle cx="618" cy="36" r="1.5" opacity="0.5"/>
    <circle cx="740" cy="140" r="1" opacity="0.35"/>
    <circle cx="872" cy="54" r="1.3" opacity="0.5"/>
    <circle cx="996" cy="128" r="1" opacity="0.4"/>
    <circle cx="1112" cy="48" r="1.5" opacity="0.55"/>
    <circle cx="140" cy="268" r="1" opacity="0.3"/>
    <circle cx="560" cy="286" r="1.2" opacity="0.4"/>
    <circle cx="1058" cy="272" r="1.1" opacity="0.4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#gRing)" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M36 24h44M36 24v44"/>
    <path d="M1120 24h44v44" transform="translate(-44 0)"/>
    <path d="M36 296v-44M36 296h44"/>
    <path d="M1164 296h-44v-44"/>
  </g>

  <!-- monogram -->
  <circle cx="600" cy="96" r="42" fill="#0d0d14" stroke="url(#gRing)" stroke-width="2.5"/>
  <circle cx="600" cy="96" r="52" fill="none" stroke="url(#gRing)" stroke-width="1" opacity="0.4"/>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" letter-spacing="2" fill="url(#gTitle)">TOP</text>

  <!-- title -->
  <text x="600" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" letter-spacing="7" fill="url(#gTitle)">TOP KONSULTAN INTERNASIONAL</text>

  <!-- divider -->
  <rect x="280" y="222" width="640" height="2.5" rx="1.25" fill="url(#gLine)"/>

  <!-- subtitle -->
  <text x="600" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4.5" fill="#a5b4fc">PUSAT PERIZINAN.ID — SATU GERBANG UNTUK SEGALA IZIN &amp; KEJAYAAN BISNIS</text>

  <!-- est line -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#64748b">EST. 2001 · TASIKMALAYA — JAKARTA · MELAYANI 190 NEGARA</text>
</svg>
